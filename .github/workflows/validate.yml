name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Browser interactions (WebGL 2 required)
        run: python tests/browser_smoke.py
        env:
          ASTRA_REQUIRE_WEBGL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-explosion-site-and-tests
          path: |
            dist/
            test-results/
          if-no-files-found: error
